name: Deploy API Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'typedoc.json'
      - 'typedoc-theme.css'

permissions:
  contents: read
  pages: write
  id-token: write

# Deliberately keyed on `pages` rather than on workflow+ref, unlike every other
# workflow in this fleet. A GitHub Pages site is a singleton deployment target:
# two concurrent deploys conflict no matter which refs produced them, and this
# group serialises against any future Pages workflow too. The trigger is
# push-to-main plus workflow_dispatch, so ref is always `main` in practice and
# the two keys are equivalent here anyway.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # MEASURED locally: `npm ci` 5s, `npx typedoc` runs over the same src the
    # 4s typecheck covers. The job is npm ci + typedoc + a Pages upload.
    # Realistic worst case ~3m; 10 is >3x, and the Pages deploy API is the only
    # part that can stall.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx typedoc

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: api-docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
