name: Release dry run (FORMA-027 throwaway)

# THROWAWAY, removed before review. release.yml's job structure exactly
# (its concurrency block, the `engines` job, `publish` needing it) on a PR,
# with `publish` reduced to an echo: no environment, no secrets, no npm.
# It shows that a red engine skips `publish`, and a green run reaches it.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engines:
    uses: ./.github/workflows/e2e-engines.yml
    permissions:
      contents: read

  publish:
    needs: engines
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - run: echo "dry run - release.yml would run npm publish here; nothing is published"
