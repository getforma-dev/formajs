name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers / deployment secrets are configured on this
    # environment, so a tag push cannot publish unattended.
    environment: npm-publish
    env:
      # Cross-repo dispatch PAT (optional). Surfaced as env so the notify step
      # can skip cleanly when it isn't configured, rather than erroring.
      FORMA_DISPATCH_TOKEN: ${{ secrets.FORMA_DISPATCH_TOKEN }}
    permissions:
      contents: read
      id-token: write  # Required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

      # The e2e suite is the only thing that exercises the built artifacts in a
      # real browser. The CI badge implies it gates the code, so release must
      # run it too — a hydration regression it catches must not ship.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e   # builds, then drives dist/formajs-runtime.global.js

      - run: npm run build
      - run: npm run check:size
      - run: npm run check:pack

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      # Trusted publishing: uses OIDC for auth, no npm token needed.
      # Provenance is generated automatically.
      # Configure at: npmjs.com/package/@getforma/core → Settings → Trusted Publisher
      #
      # --ignore-scripts skips prepublishOnly, which would otherwise rebuild
      # dist AFTER the gates above measured it. The bytes that get published are
      # then exactly the bytes check:size and check:pack inspected.
      - run: npm publish --access public --ignore-scripts

      - name: Notify create-forma-app to update dependency
        # Skip silently when no dispatch PAT is configured (OIDC covers npm
        # publish but not cross-repo dispatch). continue-on-error is a
        # belt-and-suspenders for an expired/invalid token.
        if: success() && env.FORMA_DISPATCH_TOKEN != ''
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ env.FORMA_DISPATCH_TOKEN }}
          repository: getforma-dev/create-forma-app
          event-type: core-release
          client-payload: '{"version": "${{ github.ref_name }}"}'
