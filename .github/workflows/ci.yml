name: CI

on:
  push:
    branches: [main]
    # Doc-only pushes to main do not need six runners. Deliberately NOT on
    # `pull_request`: a skipped workflow leaves a required status check
    # permanently pending and the PR can never merge. Extend to pull_request
    # only after confirming branch protection allows it.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  # No `schedule` here (FORMA-179): the nightly mutation run is its own
  # workflow, nightly-probes.yml, so no PR or push shows a job that only a
  # schedule could start as permanently "skipped".
  workflow_dispatch:

# This repo previously had NO concurrency group on CI (only docs.yml had one,
# `group: pages`), so every superseded push kept its runners. On 2026-08-06 the
# four Forma repos asked for ~44 concurrent jobs against a 20-job limit and
# jobs sat 20-58 minutes waiting for a runner; that queue time was misread as
# hanging jobs. A newer run on the same ref cancels the one it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job declares its token (FORMA-010): each one only reads this
# repository. The cache and artifact steps authenticate with the runner's own
# service token, which `permissions:` does not govern.
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # MEASURED locally: typecheck 4s, test:coverage 9s, build 6s, check:size
    # 1s — 20s of actual work. `npm ci` measured 5s locally, 30-60s on a
    # runner. Realistic worst case ~2m; 10 is 5x, and the whole job is
    # deterministic with no server and no browser.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The lowest entry here is what package.json `engines.node` may claim:
        # a floor no job executes is an untested promise. Keep them in step.
        # Verified by: src/__tests__/package-exports.test.ts > "the engines floor is a version CI actually runs"
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      # `build` ends in scripts/verify-dist.mjs, which asserts the properties
      # the docs claim about the shipped artifacts (self-contained CDN bundle,
      # build-time __DEV__, no eval or new Function in ANY build, every exports target
      # present). A doc-breaking build fails here.
      - run: npm run build
      - run: npm run check:size

  # The mutation-probe corpus (probes/corpus.json). Per-PR this is the cheap
  # half: every probe's anchor must still apply to the file it names, which
  # takes seconds and catches the failure mode where a refactor silently turns
  # a mutant into a no-op and the detection rate climbs for free.
  # The expensive half — actually applying each probe and running the suite —
  # is nightly-probes.yml, on a schedule of its own.
  # Verified by: src/__tests__/probe-corpus.test.ts > "every probe still applies to the file it names"
  probes-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # MEASURED locally: `node scripts/run-probes.mjs --check` = under 1s for
    # all 93 probes. The job is `npm ci` and nothing else. 8 is >4x a 1.5m run.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/run-probes.mjs --check

  # Packaging surface. Split out because it is Node-version independent and
  # would have caught the node10 / global-subpath / missing-package.json
  # export defects the 2026-08 hardening audit found.
  #
  # `needs: test` is a runner-demand fix, not a correctness one: it re-runs the
  # same build `test` already ran, so there is nothing to learn from it when
  # `test` is red. Gating it takes this workflow's peak concurrent demand from
  # 6 jobs to 4.
  package:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    # MEASURED locally: build 6s, check:pack (publint + attw, over the package
    # and again over its development build, FORMA-169) 10s. `attw --pack`
    # shells out to `npm pack`. Realistic worst case ~2m; 10 is 5x.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:pack

  e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: test
    # MEASURED locally: `npm run test:e2e` = 15s wall (build + copy + 30 specs
    # in 7.3s, all green). In CI the healthy run measured 5.4m end to end, of
    # which playwright install was 0.3m. The Playwright config gives webServer
    # no explicit timeout, so it inherits the 60s default — `npx serve` failing
    # to bind fails the run at 60s and cannot hang. The two install steps are
    # bounded on their own with one retry each (at most 11 and 5 minutes,
    # FORMA-179), so 20 holds both at their worst plus a slow run of the rest.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Chromium is installed as e2e-engines.yml installs each engine
      # (FORMA-179): its system packages, then the browser, each from a cache
      # keyed on the resolved Playwright version, each bounded with one retry.
      # The keys are the ones e2e-engines.yml's chromium leg writes.
      - name: Resolve Playwright version and runner image
        id: pw
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # apt checks each restored archive against the signed package index
      # before it installs it, and downloads again any that differs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install chromium's system packages, retried once
        # Normally seconds (22 MB in 2s); each attempt is cut at 4 minutes;
        # worst case about 9m40s with the dpkg wait, so 11.
        timeout-minutes: 11
        run: |
          shopt -s nullglob
          mkdir -p ~/.cache/playwright-apt
          cached=(~/.cache/playwright-apt/*.deb)
          echo "${#cached[@]} archives restored from the cache"
          if [ "${#cached[@]}" -gt 0 ]; then sudo cp "${cached[@]}" /var/cache/apt/archives/; fi
          for attempt in 1 2; do
            if timeout --kill-after=20s 4m npx playwright install-deps chromium; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo "::error::installing chromium's system packages failed twice; see the apt output above"
              exit 1
            fi
            echo "::warning::installing chromium's system packages failed or ran past 4 minutes; retrying once"
            # The same retry as e2e-engines.yml's: `dpkg --configure -a` may
            # fail on a lock the cut `apt-get` still holds, and errexit would
            # end the step before attempt 2 (A2 audit F17a, FORMA-180).
            sudo dpkg --configure -a || true
            for waited in $(seq 1 60); do
              if ! sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then break; fi
              if [ "$waited" = 60 ]; then echo "::warning::the dpkg lock is still held after 60s; attempt 2 runs anyway"; fi
              sleep 1
            done
          done
          fresh=(/var/cache/apt/archives/*.deb)
          if [ "${#fresh[@]}" -gt 0 ]; then cp "${fresh[@]}" ~/.cache/playwright-apt/; fi
          echo "${#fresh[@]} archives kept for the cache"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install chromium, retried once
        # A no-op on a cache hit; each attempt is cut at 2 minutes.
        timeout-minutes: 5
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=20s 2m npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::installing chromium failed or ran past 2 minutes (attempt $attempt of 2)"
          done
          echo "::error::installing chromium failed twice; see the output above"
          exit 1

      - run: npm run test:e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # SR43 (FORMA-134): release.yml keeps `id-token: write` on its publish job
  # alone, with no cache and no dependency code beside it. actionlint checks
  # every workflow's syntax and, with the runner's shellcheck, its scripts;
  # check-release-workflow.rb checks SR43's shape and, with --self-test, that
  # each of its rules catches a violation seeded into a copy of the workflow;
  # test-release-artifacts.sh checks that a packed file altered between the
  # pack and publish jobs fails the check the publish job runs first.
  release-workflow:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # MEASURED locally: actionlint and shellcheck under 1s over these
    # workflows, the lint and its self-test under 1s, the artefact tests about
    # 1s; the actionlint download is 2.4 MB. 5 bounds a slow download.
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, checked on 2026-10-14
      # against the release's checksums file and GitHub's asset digest, with
      # its build provenance verified (`gh attestation verify -R
      # rhysd/actionlint`: signed by the release workflow at refs/tags/v1.7.12).
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install actionlint, checked against its pinned SHA-256
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          shellcheck --version | head -2
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint"
      - name: SR43 lint and its seeded violations
        run: |
          ruby --version
          ruby scripts/check-release-workflow.rb --self-test
      - name: A packed file altered between jobs fails the publish job's check
        run: bash scripts/test-release-artifacts.sh
