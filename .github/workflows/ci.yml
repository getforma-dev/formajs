name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest entry here is what package.json `engines.node` may claim:
        # a floor no job executes is an untested promise. Keep them in step.
        # Verified by: src/__tests__/package-exports.test.ts > "the engines floor is a version CI actually runs"
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      # `build` ends in scripts/verify-dist.mjs, which asserts the properties
      # the docs claim about the shipped artifacts (self-contained CDN bundle,
      # build-time __DEV__, no eval in the hardened builds, every exports target
      # present). A doc-breaking build fails here.
      - run: npm run build
      - run: npm run check:size

  # Packaging surface. Split out because it is Node-version independent and
  # would have caught the node10 / global-subpath / missing-package.json
  # export defects the 2026-08 hardening audit found.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:pack

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
